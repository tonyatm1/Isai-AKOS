<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050812">
  <title>ISAI · AKOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050812;
      --panel: rgba(13, 20, 38, 0.78);
      --line: rgba(255,255,255,0.10);
      --text: #f5f8ff;
      --muted: #8491aa;
      --blue: #5b8cff;
      --cyan: #71d9ff;
      --green: #72ffb0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #203967 0%, transparent 45%),
        radial-gradient(circle at 0% 100%, #111d3b 0%, transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 560px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 18px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .core {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #b9e8ff 20%,
          #5b8cff 48%,
          #182752 75%,
          #080d1d 100%
        );

      box-shadow:
        0 0 12px rgba(91,140,255,0.9),
        0 0 30px rgba(91,140,255,0.45),
        0 0 55px rgba(113,217,255,0.18);

      animation: corePulse 2.4s infinite ease-in-out;
    }

    @keyframes corePulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 12px rgba(91,140,255,0.8),
          0 0 30px rgba(91,140,255,0.35);
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 18px rgba(91,140,255,1),
          0 0 42px rgba(91,140,255,0.55);
      }
    }

    .name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--green);
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 2px 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto 0;
      padding: 35px 18px;
      text-align: center;
    }

    .welcome-orb {
      width: 90px;
      height: 90px;
      margin: 0 auto 22px;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          white 0%,
          #9ddfff 16%,
          #4f82ff 38%,
          #182b5b 65%,
          transparent 70%
        );

      box-shadow:
        0 0 30px rgba(91,140,255,0.5),
        0 0 80px rgba(113,217,255,0.15);

      animation: welcomePulse 3s infinite;
    }

    @keyframes welcomePulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* MESSAGES */

    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      animation: messageIn 0.22s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(
        135deg,
        #315ca8,
        #3d6fc7
      );
      border-bottom-right-radius: 5px;
    }

    .isai {
      align-self: flex-start;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.09);
      border-bottom-left-radius: 5px;
    }

    .typing {
      color: #9db0d1;
      font-style: italic;
    }

    /* INPUT */

    .input-panel {
      padding-top: 8px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;

      border: 1px solid var(--line);
      outline: none;

      background: rgba(255,255,255,0.055);
      color: white;

      border-radius: 18px;

      padding: 0 15px;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(91,140,255,0.7);
      box-shadow: 0 0 15px rgba(91,140,255,0.08);
    }

    input::placeholder {
      color: #68758e;
    }

    .control-button {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;

      border: none;
      border-radius: 50%;

      color: white;
      font-size: 18px;
      font-weight: bold;

      background: #315ca8;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .control-button:active {
      transform: scale(0.92);
    }

    .control-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .mic-button {
      background: #263b68;
    }

    .mic-button.listening {
      background: #9b315e;
      box-shadow:
        0 0 20px rgba(255,80,150,0.45);
    }

    /* VOICE BUTTONS */

    .voice-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 9px;
    }

    .small-button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.045);
      color: #9aa8c0;

      border-radius: 12px;
      padding: 7px 11px;

      font-size: 11px;
      cursor: pointer;
    }

    .small-button:active {
      transform: scale(0.96);
    }

    /* DEBUG */

    .debug {
      min-height: 18px;
      padding-top: 7px;

      text-align: center;

      color: #63718a;
      font-size: 10px;
      letter-spacing: 0.2px;
    }

    /* SCROLLBAR */

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="identity">

        <div class="core"></div>

        <div>
          <div class="name">ISAI</div>

          <div
            class="status"
            id="status"
          >
            AKOS CORE · LOADING
          </div>
        </div>

      </div>

    </header>


    <section
      class="chat"
      id="chat"
    >

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-orb"></div>

        <h1>Isai</h1>

        <p>
          AKOS companion core
          <br>
          Memory · Emotion · Reflection · Initiative
          <br><br>
          Talk to me.
        </p>

      </div>

    </section>


    <div class="input-panel">

      <div class="input-area">

        <input
          id="messageInput"
          type="text"
          placeholder="Talk to Isai..."
          autocomplete="off"
        >

        <button
          id="micButton"
          class="control-button mic-button"
          type="button"
          aria-label="Voice input"
        >
          🎙
        </button>

        <button
          id="sendButton"
          class="control-button"
          type="button"
          aria-label="Send message"
        >
          ↑
        </button>

      </div>


      <div class="voice-row">

        <button
          id="stopVoiceButton"
          class="small-button"
          type="button"
        >
          🔇 Stop voice
        </button>

        <button
          id="testVoiceButton"
          class="small-button"
          type="button"
        >
          🔊 Test voice
        </button>

      </div>


      <div
        class="debug"
        id="debug"
      >
        Starting Isai Core...
      </div>

    </div>

  </main>


  <script type="module">

    /*
     * =========================================================
     * ISAI · AKOS
     * FRONTEND CORE
     * =========================================================
     */

    let isaiBrain = null;

    let recognition = null;

    let listening = false;

    let voices = [];


    /*
     * ---------------------------------------------------------
     * ELEMENTS
     * ---------------------------------------------------------
     */

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const micButton =
      document.getElementById("micButton");

    const stopVoiceButton =
      document.getElementById("stopVoiceButton");

    const testVoiceButton =
      document.getElementById("testVoiceButton");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    const debug =
      document.getElementById("debug");

    const status =
      document.getElementById("status");


    /*
     * ---------------------------------------------------------
     * CORE LOADER
     *
     * IMPORTANT:
     * We do NOT import brain.js at the top.
     *
     * This lets the UI detect an import/core error
     * instead of getting stuck silently.
     * ---------------------------------------------------------
     */

    async function loadIsaiCore() {

      status.textContent =
        "AKOS CORE · CONNECTING";

      debug.textContent =
        "Loading Isai Core...";


      try {

        const module =
          await import("./core/brain.js");


        if (
          !module ||
          !module.isaiBrain
        ) {

          throw new Error(
            "isaiBrain export not found"
          );

        }


        isaiBrain =
          module.isaiBrain;


        status.textContent =
          "AKOS CORE · ONLINE";

        debug.textContent =
          "Isai Core · Ready";


        input.disabled =
          false;

        sendButton.disabled =
          false;


        input.focus();


        console.log(
          "ISAI CORE ONLINE",
          isaiBrain
        );


      } catch (error) {

        console.error(
          "ISAI CORE LOAD ERROR:",
          error
        );


        status.textContent =
          "AKOS CORE · ERROR";

        debug.textContent =
          "Core load failed · Check core/brain.js";


        addMessage(
          "Isai Core start aagala. Core file-la problem irukku. Debug information console-la available.",
          "isai"
        );


        input.disabled =
          true;

        sendButton.disabled =
          true;

      }

    }


    /*
     * ---------------------------------------------------------
     * MESSAGE UI
     * ---------------------------------------------------------
     */

    function addMessage(
      text,
      type
    ) {

      if (welcome) {

        welcome.remove();

      }


      const message =
        document.createElement("div");


      message.className =
        `message ${type}`;


      message.textContent =
        String(text);


      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;


      return message;

    }


    function addTypingMessage() {

      if (welcome) {

        welcome.remove();

      }


      const message =
        document.createElement("div");


      message.className =
        "message isai typing";


      message.textContent =
        "Isai is thinking...";


      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;


      return message;

    }


    /*
     * ---------------------------------------------------------
     * VOICE OUTPUT
     * ---------------------------------------------------------
     */

    function loadVoices() {

      if (
        "speechSynthesis" in window
      ) {

        voices =
          window.speechSynthesis
            .getVoices();

      }

    }


    if (
      "speechSynthesis" in window
    ) {

      loadVoices();


      window.speechSynthesis
        .addEventListener(
          "voiceschanged",
          loadVoices
        );

    }


    function speak(text) {

      if (
        !text ||
        !("speechSynthesis" in window)
      ) {

        return;

      }


      try {

        window.speechSynthesis.cancel();


        const utterance =
          new SpeechSynthesisUtterance(
            String(text)
          );


        const preferredVoice =
          voices.find(
            voice =>
              voice.lang
                .toLowerCase()
                === "en-in"
          ) ||
          voices.find(
            voice =>
              voice.lang
                .toLowerCase()
                .startsWith("en")
          );


        if (preferredVoice) {

          utterance.voice =
            preferredVoice;

          utterance.lang =
            preferredVoice.lang;

        } else {

          utterance.lang =
            "en-IN";

        }


        utterance.rate =
          0.95;

        utterance.pitch =
          1.05;

        utterance.volume =
          1;


        utterance.onstart =
          () => {

            debug.textContent =
              "Isai · Speaking...";

          };


        utterance.onend =
          () => {

            debug.textContent =
              "Isai Core · Ready";

          };


        utterance.onerror =
          error => {

            console.warn(
              "ISAI TTS ERROR:",
              error
            );

            debug.textContent =
              "Isai · Voice unavailable";

          };


        window.speechSynthesis
          .speak(
            utterance
          );

      } catch (error) {

        console.error(
          "TTS ERROR:",
          error
        );

      }

    }


    function stopVoice() {

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

        debug.textContent =
          "Isai · Voice stopped";

      }

    }


    /*
     * ---------------------------------------------------------
     * RESPONSE EXTRACTION
     * ---------------------------------------------------------
     */

    function extractResponse(
      result
    ) {

      if (!result) {

        return null;

      }


      if (
        typeof result === "string"
      ) {

        return result.trim();

      }


      const fields = [

        result.response,

        result.reply,

        result.text,

        result.output,

        result.answer,

        result.content

      ];


      for (
        const value of fields
      ) {

        if (
          typeof value === "string" &&
          value.trim()
        ) {

          return value.trim();

        }

      }


      if (
        result.message &&
        typeof result.message === "object" &&
        typeof result.message.text === "string"
      ) {

        return result.message.text.trim();

      }


      return null;

    }


    /*
     * ---------------------------------------------------------
     * CORE DEBUG
     * ---------------------------------------------------------
     */

    function updateCoreDebug(
      result
    ) {

      try {

        const emotion =
          result?.emotionalState?.mood ||
          result?.emotionalState?.type;


        if (emotion) {

          debug.textContent =
            `Isai Core · ${emotion}`;

        } else {

          debug.textContent =
            "Isai Core · Connected";

        }

      } catch {

        debug.textContent =
          "Isai Core · Connected";

      }

    }


    /*
     * ---------------------------------------------------------
     * SEND MESSAGE
     * ---------------------------------------------------------
     */

    async function sendMessage() {

      if (!isaiBrain) {

        addMessage(
          "Isai Core is not ready yet.",
          "isai"
        );

        return;

      }


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      addMessage(
        text,
        "user"
      );


      input.value = "";

      sendButton.disabled =
        true;

      micButton.disabled =
        true;


      debug.textContent =
        "Isai Core · Thinking...";


      const typing =
        addTypingMessage();


      try {

        const result =
          await isaiBrain.process({

            text: text,

            userPresent: true,

            meaningful:
              text.length > 80

          });


        if (typing) {

          typing.remove();

        }


        console.log(
          "ISAI RESPONSE:",
          result
        );


        updateCoreDebug(
          result
        );


        const reply =
          extractResponse(
            result
          );


        if (!reply) {

          addMessage(
            "Isai Core received the message, but no response text came back.",
            "isai"
          );

          debug.textContent =
            "Isai Core · Empty response";

          return;

        }


        addMessage(
          reply,
          "isai"
        );


        speak(
          reply
        );


      } catch (error) {

        console.error(
          "ISAI CHAT ERROR:",
          error
        );


        if (typing) {

          typing.remove();

        }


        addMessage(
          "Isai Core connection-la problem vandhudhu. Core error console-la check pannalaam.",
          "isai"
        );


        debug.textContent =
          "Isai Core · Error";

      } finally {

        sendButton.disabled =
          false;

        micButton.disabled =
          false;

        input.focus();

      }

    }


    /*
     * ---------------------------------------------------------
     * VOICE INPUT
     * ---------------------------------------------------------
     */

    function setupVoiceInput() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        micButton.disabled =
          true;

        micButton.title =
          "Voice input is not supported";

        return;

      }


      recognition =
        new SpeechRecognition();


      recognition.continuous =
        false;

      recognition.interimResults =
        false;

      recognition.lang =
        "en-IN";


      recognition.onstart =
        () => {

          listening =
            true;

          micButton.classList.add(
            "listening"
          );

          debug.textContent =
            "Isai · Listening...";

        };


      recognition.onresult =
        event => {

          const transcript =
            event.results[0][0]
              .transcript;


          input.value =
            transcript;

        };


      recognition.onerror =
        error => {

          console.warn(
            "VOICE INPUT ERROR:",
            error
          );

          debug.textContent =
            "Isai · Voice input error";

        };


      recognition.onend =
        () => {

          listening =
            false;

          micButton.classList.remove(
            "listening"
          );


          if (
            input.value.trim()
          ) {

            sendMessage();

          } else {

            debug.textContent =
              "Isai Core · Ready";

          }

        };

    }


    /*
     * ---------------------------------------------------------
     * EVENTS
     * ---------------------------------------------------------
     */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    micButton.addEventListener(
      "click",
      () => {

        if (!recognition) {

          debug.textContent =
            "Voice input unavailable.";

          return;

        }


        if (listening) {

          recognition.stop();

        } else {

          try {

            recognition.start();

          } catch (error) {

            console.warn(
              "Recognition start:",
              error
            );

          }

        }

      }
    );


    stopVoiceButton.addEventListener(
      "click",
      stopVoice
    );


    testVoiceButton.addEventListener(
      "click",
      () => {

        speak(
          "Hello Akash. This is Isai. AKOS Core voice test is working."
        );

      }
    );


    /*
     * ---------------------------------------------------------
     * START
     * ---------------------------------------------------------
     */

    input.disabled =
      true;

    sendButton.disabled =
      true;


    setupVoiceInput();


    loadIsaiCore();

  </script>

</body>
</html>
